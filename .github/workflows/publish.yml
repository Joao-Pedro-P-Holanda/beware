name: Publish python package

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }} - ${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Package build
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: pipx install poetry==2.5.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14' 

      - name: Build package wheel and tarball
        run: poetry build

      - name: Store package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-package
          path: dist/

  publish-to-pypi:
    name: Package distribution
    runs-on: ubuntu-26.04
    needs:
      - build
    environment:
      name: publishing
      url: https://pypi.org/p/beware
    permissions:
      id-token: write # needed for OIDC
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8.0.2
      with:
        name: python-package
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.3
