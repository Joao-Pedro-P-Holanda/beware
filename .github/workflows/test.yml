# test on cpython and pypy
name: Tests

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - ".github/workflows/dependabot.yml"
      - "docs/**"
      - "*.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - ".github/workflows/dependabot.yml"
      - "docs/**"
      - "*.md"
      - ".gitignore"
      - "LICENSE"

permissions: {}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-22.04
    permissions: {}
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "pypy3.10"
          - "3.11"
          - "pypy3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
      max-parallel: 8
      fail-fast: false
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.python-version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - run: pipx install poetry==2.4.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'poetry'

      - run: poetry sync --only test

      - name: Run documentation tests 
        run: poetry run pytest --doctest-modules src

      - name: Run tests with coverage
        run: poetry run coverage run --source=src -m pytest

      - name: Publish coverage on workflow summary
        run: poetry run coverage report --format=markdown >> ${GITHUB_STEP_SUMMARY}
